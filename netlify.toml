[build]
  command = "npm run build"
  publish = "dist/skill-hunter/browser"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.mcp]
  included_files = ["skill-hunter-mcp/src/**"]

[dev]
  # Use start:app (ng serve only) — netlify emulates /api functions itself.
  # Plain `npm start` also boots scripts/local-ai-api.mjs for localhost:4200.
  command = "npm run start:app"
  targetPort = 4200
  port = 8888
  publish = "dist/skill-hunter/browser"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Note: no redirect for /mcp — the mcp.mjs function declares
# `config.path = '/mcp'` (Netlify Functions v2), which makes it own that
# route directly. A `force = true` redirect to /.netlify/functions/mcp used
# to run *before* that route match and rewrote requests to an address the
# function no longer listens on once a custom path is set, producing a 404.

# SPA fallback so deep links like /subjects/angular/topics/angular-signals
# resolve to index.html and let the Angular router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep the service worker and its manifest fresh so clients pick up new builds.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
