[build]
  command = "npm run build"
  publish = "dist/skill-hunter/browser"
  functions = "netlify/functions"

[dev]
  # Use start:app (ng serve only) — netlify emulates /api functions itself.
  # Plain `npm start` also boots scripts/local-ai-api.mjs for localhost:4200.
  command = "npm run start:app"
  targetPort = 4200
  port = 8888
  publish = "dist/skill-hunter/browser"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so deep links like /subjects/angular/topics/angular-signals
# resolve to index.html and let the Angular router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep the service worker and its manifest fresh so clients pick up new builds.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
