name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm ci
        working-directory: skill-hunter-mcp
      - run: npm test
        working-directory: skill-hunter-mcp
