<button
  type="button"
  class="read-aloud-button"
  [class.read-aloud-button--active]="speaking()"
  [disabled]="disabled()"
  [attr.aria-pressed]="speaking()"
  [attr.aria-label]="speaking() ? 'Stop listening' : 'Listen to this topic'"
  [appTooltip]="speaking() ? 'Stop narration' : 'Listen to this topic'"
  tooltipPos="bottom"
  (click)="toggled.emit()"
>
  <app-icon [name]="speaking() ? 'square' : 'volume-2'" [filled]="speaking()" />
  <span>{{ speaking() ? 'Stop' : 'Listen' }}</span>
</button>
