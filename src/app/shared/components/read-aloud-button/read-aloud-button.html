<button
  type="button"
  class="read-aloud-button"
  [class.read-aloud-button--active]="speaking()"
  [disabled]="disabled()"
  [attr.aria-pressed]="speaking()"
  [attr.aria-label]="speaking() ? 'Stop reading aloud' : 'Read aloud'"
  (click)="toggled.emit()"
>
  <app-icon [name]="speaking() ? 'square' : 'volume-2'" [filled]="speaking()" />
  <span>{{ speaking() ? 'Stop' : 'Read Aloud' }}</span>
</button>
