<a
  class="subject-card"
  [style.--accent]="visual().color"
  [routerLink]="['/subjects', subject().id]"
>
  <span class="subject-card__icon" aria-hidden="true">{{ visual().emoji }}</span>
  <h3>{{ subject().title }}</h3>
  <p class="subject-card__description">{{ subject().description }}</p>
  <app-progress-bar [percentage]="percentage()" />
  <p class="subject-card__count">{{ completed() }} / {{ total() }} topics completed</p>
</a>
