<div class="bar-chart">
  @for (row of rows(); track row.label) {
    <div class="bar-chart__row" [attr.title]="row.label + ': ' + valueLabel(row)">
      <span class="bar-chart__label">{{ row.label }}</span>
      <div class="bar-chart__track">
        <div
          class="bar-chart__fill"
          [style.width.%]="widthFor(row)"
          [style.background]="row.color"
        ></div>
      </div>
      <span class="bar-chart__value">{{ valueLabel(row) }}</span>
    </div>
  }
</div>
