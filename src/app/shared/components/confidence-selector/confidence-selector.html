<div class="confidence-selector" role="group" aria-label="Rate your confidence">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="confidence-selector__option"
      [class.confidence-selector__option--active]="confidence() === option.value"
      [class.confidence-selector__option--low]="option.value === 'low'"
      [class.confidence-selector__option--medium]="option.value === 'medium'"
      [class.confidence-selector__option--high]="option.value === 'high'"
      [attr.aria-pressed]="confidence() === option.value"
      (click)="changed.emit(option.value)"
    >
      <app-icon name="circle" [filled]="true" [style.color]="option.color" />
      {{ option.label }}
    </button>
  }
</div>
