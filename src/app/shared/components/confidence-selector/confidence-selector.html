<div class="confidence-selector" role="group" aria-label="Rate your confidence">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="confidence-selector__option"
      [class.confidence-selector__option--active]="confidence() === option.value"
      [attr.aria-pressed]="confidence() === option.value"
      (click)="changed.emit(option.value)"
    >
      <span aria-hidden="true">{{ option.emoji }}</span>
      {{ option.label }}
    </button>
  }
</div>
