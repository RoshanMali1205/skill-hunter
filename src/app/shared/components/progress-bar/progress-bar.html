@if (label()) {
  <div class="progress-bar__label">
    <span>{{ label() }}</span>
    <span>{{ clamped() }}%</span>
  </div>
}
<div
  class="progress-bar"
  role="progressbar"
  [attr.aria-valuenow]="clamped()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="label() ?? 'Progress'"
>
  <div class="progress-bar__fill" [style.width.%]="clamped()"></div>
</div>
