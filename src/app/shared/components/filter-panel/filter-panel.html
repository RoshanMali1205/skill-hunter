<div class="filter-panel">
  <label class="filter-panel__field">
    <span>Search topics</span>
    <input
      type="search"
      [ngModel]="filter().searchTerm"
      (ngModelChange)="update({ searchTerm: $event })"
      placeholder="Search by title or tag..."
    />
  </label>

  <label class="filter-panel__field">
    <span>Difficulty</span>
    <app-select
      [value]="filter().difficulty ?? 'all'"
      [options]="difficultyOptions"
      ariaLabel="Difficulty"
      (valueChange)="update({ difficulty: $any($event) })"
    />
  </label>

  <label class="filter-panel__field">
    <span>Priority</span>
    <app-select
      [value]="filter().priority ?? 'all'"
      [options]="priorityOptions"
      ariaLabel="Priority"
      (valueChange)="update({ priority: $any($event) })"
    />
  </label>

  <label class="filter-panel__field">
    <span>Status</span>
    <app-select
      [value]="filter().status ?? 'all'"
      [options]="statusOptions"
      ariaLabel="Status"
      (valueChange)="update({ status: $any($event) })"
    />
  </label>

  <label class="filter-panel__field filter-panel__field--checkbox">
    <input
      type="checkbox"
      [ngModel]="filter().bookmarked ?? false"
      (ngModelChange)="update({ bookmarked: $event })"
    />
    <span>Only bookmarked</span>
  </label>
</div>
