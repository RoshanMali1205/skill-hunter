<div class="filter-panel">
  <label class="filter-panel__field">
    <span>Search topics</span>
    <input
      type="search"
      [ngModel]="filter().searchTerm"
      (ngModelChange)="update({ searchTerm: $event })"
      placeholder="Search by title or tag..."
    />
  </label>

  <label class="filter-panel__field">
    <span>Difficulty</span>
    <select [ngModel]="filter().difficulty ?? 'all'" (ngModelChange)="update({ difficulty: $event })">
      <option value="all">All</option>
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
  </label>

  <label class="filter-panel__field">
    <span>Priority</span>
    <select [ngModel]="filter().priority ?? 'all'" (ngModelChange)="update({ priority: $event })">
      <option value="all">All</option>
      <option value="must-know">Must Know</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>

  <label class="filter-panel__field">
    <span>Status</span>
    <select [ngModel]="filter().status ?? 'all'" (ngModelChange)="update({ status: $event })">
      <option value="all">All</option>
      <option value="not-started">Not Started</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>
  </label>

  <label class="filter-panel__field filter-panel__field--checkbox">
    <input
      type="checkbox"
      [ngModel]="filter().bookmarked ?? false"
      (ngModelChange)="update({ bookmarked: $event })"
    />
    <span>Only bookmarked</span>
  </label>
</div>
