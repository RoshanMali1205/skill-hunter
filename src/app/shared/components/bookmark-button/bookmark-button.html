<button
  type="button"
  class="bookmark-button"
  [class.bookmark-button--active]="bookmarked()"
  [attr.aria-pressed]="bookmarked()"
  [attr.aria-label]="bookmarked() ? 'Remove bookmark' : 'Add bookmark'"
  (click)="toggled.emit()"
>
  <app-icon name="bookmark" [filled]="bookmarked()" />
  <span>{{ bookmarked() ? 'Bookmarked' : 'Bookmark' }}</span>
</button>
