@if (!revealed()) {
  @if (hints().length > 0) {
    <ul class="answer-reveal__hints">
      @for (hint of hints(); track hint) {
        <li [innerHTML]="hint | markdownInline"></li>
      }
    </ul>
  }
  <button type="button" class="btn btn--primary" (click)="toggle()">Show Answer</button>
} @else {
  <div class="answer-reveal__content">
    <div class="answer-reveal__answer answer-reveal__markdown" [innerHTML]="answer() | markdown"></div>
    @if (explanation()) {
      <div class="answer-reveal__explanation answer-reveal__markdown" [innerHTML]="explanation() | markdown"></div>
    }
    <button type="button" class="btn btn--ghost" (click)="toggle()">Hide Answer</button>
  </div>
}
