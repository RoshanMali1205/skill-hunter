<button
  type="button"
  class="btn"
  [class.btn--primary]="!revealed()"
  [class.btn--ghost]="revealed()"
  [attr.aria-expanded]="revealed()"
  (click)="toggle()"
>
  {{ revealed() ? 'Hide Answer' : 'Show Answer' }}
</button>
@if (!revealed()) {
  @if (hints().length > 0) {
    <ul class="answer-reveal__hints">
      @for (hint of hints(); track hint) {
        <li [innerHTML]="hint | markdownInline"></li>
      }
    </ul>
  }
} @else {
  <div class="answer-reveal__content">
    <div
      class="answer-reveal__answer answer-reveal__markdown"
      [innerHTML]="answer() | markdown"
    ></div>
    @if (explanation()) {
      <div
        class="answer-reveal__explanation answer-reveal__markdown"
        [innerHTML]="explanation() | markdown"
      ></div>
    }
  </div>
}
