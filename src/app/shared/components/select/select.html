<div class="select">
  <button
    type="button"
    class="select__trigger"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span class="select__value" [class.select__value--placeholder]="!hasSelection()">
      {{ selectedLabel() }}
    </span>
    <app-icon name="chevron-down" class="select__chevron" />
  </button>

  @if (open()) {
    <ul class="select__menu" role="listbox">
      @if (groups().length > 0) {
        @for (group of groups(); track group.label) {
          <li class="select__group-label" role="presentation">{{ group.label }}</li>
          @for (option of group.options; track option.value) {
            <li role="option" [attr.aria-selected]="option.value === value()">
              <button
                type="button"
                class="select__option"
                [class.select__option--active]="option.value === value()"
                [disabled]="option.disabled"
                (click)="select(option)"
              >
                {{ option.label }}
              </button>
            </li>
          }
        }
      } @else {
        @for (option of options(); track option.value) {
          <li role="option" [attr.aria-selected]="option.value === value()">
            <button
              type="button"
              class="select__option"
              [class.select__option--active]="option.value === value()"
              [disabled]="option.disabled"
              (click)="select(option)"
            >
              {{ option.label }}
            </button>
          </li>
        }
      }
    </ul>
  }
</div>
