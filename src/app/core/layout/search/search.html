<div class="search" [class.search--header]="variant() === 'header'">
  @if (variant() === 'header') {
    <span class="search__icon" aria-hidden="true"><app-icon name="search" /></span>
  }

  <input
    #searchInput
    type="search"
    class="search__input"
    [placeholder]="variant() === 'header' ? 'Search topics…' : 'Search topics, tags, questions...'"
    [value]="term()"
    (input)="onInput($any($event.target).value)"
    (focus)="isOpen.set(true)"
    (blur)="close()"
    aria-label="Search interview content"
    autocomplete="off"
  />

  @if (variant() === 'header') {
    <kbd class="search__hint" aria-hidden="true">/</kbd>
  }

  @if (isOpen() && term().trim().length > 1) {
    <div class="search__results">
      @if (results().length === 0) {
        <p class="search__empty">No results for "{{ term() }}"</p>
      } @else {
        @for (result of results(); track result.topicId + result.matchedIn) {
          <app-search-result [result]="result" (selected)="onResultSelected()" />
        }
      }
    </div>
  }
</div>
