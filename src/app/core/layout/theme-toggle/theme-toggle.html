<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="settings().theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  [attr.aria-pressed]="settings().theme === 'dark'"
  (click)="toggle()"
>
  @if (settings().theme === 'dark') {
    <app-icon name="sun" />
  } @else {
    <app-icon name="moon" />
  }
</button>
