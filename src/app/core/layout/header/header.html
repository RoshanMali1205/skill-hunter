<header class="header" [class.header--search-open]="mobileSearchOpen()">
  <a
    class="header__brand"
    routerLink="/dashboard"
    appTooltip="Go to dashboard"
    tooltipPos="bottom"
  >
    <span class="header__logo" aria-hidden="true"><app-icon name="target" /></span>
    <span class="header__brand-text">Skill Hunter</span>
  </a>

  <div class="header__search">
    <app-search variant="header" (closed)="onSearchClosed()" />
    @if (mobileSearchOpen()) {
      <button
        type="button"
        class="header__icon-btn header__search-dismiss"
        (click)="closeMobileSearch()"
        aria-label="Close search"
      >
        <app-icon name="x" />
      </button>
    }
  </div>

  <div class="header__actions">
    <button
      type="button"
      class="header__icon-btn header__search-toggle"
      (click)="openMobileSearch()"
      aria-label="Search topics"
      appTooltip="Search"
      tooltipPos="bottom"
      tooltipAlign="end"
    >
      <app-icon name="search" />
    </button>

    @if (user()) {
      <a
        class="header__streak"
        routerLink="/calendar"
        [appTooltip]="'Streak · ' + todayMinutes() + ' min today'"
        tooltipPos="bottom"
        tooltipAlign="end"
      >
        <app-icon name="flame" [filled]="currentStreak() > 0" />
        <span class="header__streak-value">{{ streakLabel() }}</span>
      </a>

      <div class="header__user">
        <button
          type="button"
          class="header__user-trigger"
          [class.header__user-trigger--open]="menuOpen()"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          appTooltip="Account menu"
          tooltipPos="bottom"
          tooltipAlign="end"
        >
          <span class="header__user-avatar" aria-hidden="true">
            @if (photoDataUrl(); as photo) {
              <img [src]="photo" alt="" />
            } @else {
              {{ initials() }}
            }
          </span>
          <span class="header__user-name">{{ displayName() }}</span>
          <app-icon name="chevron-down" class="header__user-chevron" />
        </button>

        @if (menuOpen()) {
          <button
            type="button"
            class="header__user-backdrop"
            aria-label="Close menu"
            (click)="closeMenu()"
          ></button>
          <div class="header__user-menu" role="menu">
            <div class="header__user-menu-identity">
              <span class="header__user-menu-avatar" aria-hidden="true">
                @if (photoDataUrl(); as photo) {
                  <img [src]="photo" alt="" />
                } @else {
                  {{ initials() }}
                }
              </span>
              <div class="header__user-menu-copy">
                <p class="header__user-menu-name">{{ displayName() }}</p>
                <p class="header__user-menu-email">{{ user()?.email }}</p>
                <p class="header__user-menu-meta">
                  {{ unlockedCount() }} / {{ totalAchievements }} badges
                </p>
              </div>
            </div>

            <a
              routerLink="/achievements"
              class="header__user-menu-item"
              role="menuitem"
              (click)="closeMenu()"
            >
              <app-icon name="medal" /> Achievements
            </a>
            <a
              routerLink="/settings"
              class="header__user-menu-item"
              role="menuitem"
              (click)="closeMenu()"
            >
              <app-icon name="user-pen" /> Edit profile
            </a>
            <a
              routerLink="/settings"
              class="header__user-menu-item"
              role="menuitem"
              (click)="closeMenu()"
            >
              <app-icon name="settings" /> Settings
            </a>
            <button
              type="button"
              class="header__user-menu-item header__user-menu-item--danger"
              role="menuitem"
              (click)="logout()"
            >
              <app-icon name="log-out" /> Log out
            </button>
          </div>
        }
      </div>
    }

    <app-theme-toggle />
  </div>
</header>
