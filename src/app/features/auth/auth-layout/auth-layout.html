<div class="auth-shell">
  <div class="auth-shell__backdrop" aria-hidden="true">
    <span class="auth-shell__orb auth-shell__orb--a"></span>
    <span class="auth-shell__orb auth-shell__orb--b"></span>
    <span class="auth-shell__orb auth-shell__orb--c"></span>
    <span class="auth-shell__grid"></span>
  </div>

  <div class="auth-shell__card">
    <a class="auth-shell__brand" routerLink="/login">
      <span class="auth-shell__logo" aria-hidden="true"><app-icon name="target" /></span>
      <span class="auth-shell__brand-text">Skill Hunter</span>
    </a>

    <router-outlet />
  </div>

  <p class="auth-shell__tagline">Learn, Practice, Prepare, Grow</p>

  <p class="auth-shell__note">
    Your account and study progress are saved only in this browser, so they will not appear on other devices — export a backup in Settings to move them. AI Mentor questions are sent to an online service, and basic usage analytics are collected.
  </p>
</div>
